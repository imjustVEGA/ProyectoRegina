<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="image-section"></div>

        <div class="center-logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path
                    d="M12 2L2 7l10 5 10-5-10-5zm0 7.5l-6.32-3.16L12 3.18l6.32 3.16L12 9.5zM2 12l10 5 10-5M2 17l10 5 10-5" />
            </svg>
        </div>

        <div class="form-section">
            <div class="title-group">
                <h1>Inicio de Sesión</h1>
                <h3>Club Regina Cancún</h3>
            </div>

            <form action="" class="form-container">
                <div class="input-group">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                    </svg>
                    <label for="username" class="sr-only" style="display:none;">Numero de empleado</label>
                    <input type="text" id="username" name="username" placeholder="Numero de empleado" required>
                </div>

                <div class="input-group">
                    <label for="password" class="sr-only" style="display:none;">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Contraseña" required>
                </div>

                <a href="#" class="forgot-password">Recuperar contraseña</a>

                <button type="submit" class="submit-btn">Iniciar sesión</button>

                <div class="register-link">
                    ¿No tienes cuenta?<br>
                    <a href="RegistroCR.html">Registrarse</a>
                </div>


            </form>
        </div>
    </div>
</body>

</html>
