<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="image-section"></div>

        <div class="center-logo">
        
        </div>

        <div class="form-section">
            <div class="title-group">
                <h1>Inicio de Sesión</h1>
                <h3>Club Regina Cancún</h3>
            </div>

            <form id="loginForm" action="" class="form-container">
                <div class="input-group">
                    <svg width="24" height="24" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                    </svg>

                    <input type="text" id="username" name="username" placeholder="Numero de empleado" required>
                </div>

                <div class="input-group">

                    <input type="password" id="password" name="password" placeholder="Contraseña" required>
                </div>

                <a href="#" class="forgot-password">Recuperar contraseña</a>
                <p id="errorMsg" style="color: red; display: none; text-align: center; margin-bottom: 10px;">El Usuario o Contraseña es incorrecto</p>
                
                <button type="submit" class="submit-btn">Iniciar sesión</button>

            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            
            if (user === 'admin' && pass === 'admin123') {
                window.location.href = 'Empleados.html';
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        });
    </script>
</body>


</html>
