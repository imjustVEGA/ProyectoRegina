        <div class="form-section">
            <div class="title-group">
                <h1>Recuperar Contraseña</h1>
                <h3 style="color: #666; font-size: 1rem; margin-top: 10px; font-weight: normal;">Ingresa tu número de empleado o correo asociado</h3>
            </div>

            <form id="recoverForm" action="" class="form-container">
                <div class="input-group">
                    <svg width="24" height="24" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                    </svg>
                    <input type="text" id="employeeId" name="employeeId" placeholder="Numero de empleado o correo" required>
                </div>
                
                <p id="successMsg" style="color: #0b5c6b; display: none; text-align: center; margin-bottom: 15px; font-weight: bold; background-color: #e6f6f8; padding: 10px; border-radius: 8px;">Si tus datos son correctos, recibirás un correo con las instrucciones para recuperar tu contraseña.</p>
                
                <button type="submit" id="submitBtn" class="submit-btn">Enviar instrucciones</button>
                <a href="Login.html" class="forgot-password" style="text-align: center; display: block; margin-top: 15px;">Volver al inicio de sesión</a>

            </form>
        </div>
    </div>

    <script>
        /**
         * Manejador del envío del formulario de recuperación de contraseña.
         * 
         * Funcionalidad:
         * 1. Previene el comportamiento por defecto de recarga de página.
         * 2. Obtiene y valida el valor ingresado (número de empleado o correo).
         * 3. Si no está vacío, muestra el mensaje de confirmación `#successMsg`.
         * 4. Deshabilita el botón de envío para evitar múltiples envíos accidentales.
         */
        document.getElementById('recoverForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const input = document.getElementById('employeeId').value;
            
            if (input.trim() !== '') {
                document.getElementById('successMsg').style.display = 'block';
                document.getElementById('submitBtn').disabled = true;
                document.getElementById('submitBtn').style.opacity = '0.5';
                document.getElementById('submitBtn').innerText = 'Enviado';
            }
        });
    </script>
