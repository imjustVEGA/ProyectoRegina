<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empleados - Club Regina</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
</head>

<body class="cuerpo-panel">
    <nav class="barra-navegacion-superior">
        <div class="nav-izquierda">
            <img src="imagenes/logoooo.png" alt="" class="img-logo">
            <span class="texto-logo">Club Regina</span>
        </div>

        <ul class="enlaces-nav">
            <li><a href="Menu.html"><i data-feather="home"></i> Inicio</a></li>
            <li class="activo"><a href="Empleados.html"><i data-feather="users"></i> Empleados</a></li>
            <li><a href="Asistencias.html"><i data-feather="clock"></i> Asistencias</a></li>
            <li><a href="RegistroCR.html"><i data-feather="user-plus"></i> Registrar Empleado</a></li>
        </ul>

        <div class="nav-derecha">
            <a href="Login.html" class="cerrar-sesion"><i data-feather="log-out"></i> Cerrar Sesión</a>
        </div>
    </nav>

    <main class="contenido-principal">
        <div class="recuadro-grande banner-asistencias">
            <div class="destacado-izquierda">
                <div class="icono-destacado icono-banner">
                    <i data-feather="users"></i>
                </div>
                <div class="texto-destacado texto-banner">
                    <h1>Gestión de Empleados</h1>
                </div>
            </div>
            <div class="destacado-derecha">
                <button class="btn-blanco" onclick="window.location.href='RegistroCR.html'"><i data-feather="user-plus"></i> Nuevo Empleado</button> 
                <button class="btn-contorno" onclick="cargarEmpleados()"><i data-feather="refresh-cw"></i> Actualizar</button>
            </div>
        </div>

        <div class="contenedor-estadisticas">
            <div class="tarjeta-estadistica">
                <div class="icono-estadistica fondo-verde-azulado-claro"><i data-feather="users"></i></div>
                <div class="datos-estadistica">
                    <h3 id="estadisticaTotalEmpleados">0</h3>
                    <p class="titulo-estadistica">Empleados</p>
                    <p class="subtitulo-estadistica">Total registrados</p>
                </div>
            </div>
            <div class="tarjeta-estadistica">
                <div class="icono-estadistica fondo-verde-azulado-claro"><i data-feather="grid"></i></div>
                <div class="datos-estadistica">
                    <h3 id="estadisticaTotalDeptos">0</h3>
                    <p class="titulo-estadistica">Departamentos</p>
                    <p class="subtitulo-estadistica">Áreas activas</p>
                </div>
            </div>
            <div class="tarjeta-estadistica">
                <div class="icono-estadistica fondo-verde-azulado-claro"><i data-feather="user-check"></i></div>
                <div class="datos-estadistica">
                    <h3 id="estadisticaNuevosMes">0</h3>
                    <p class="titulo-estadistica">Nuevos este mes</p>
                    <p class="subtitulo-estadistica">Últimos 30 días</p>
                </div>
            </div>

        </div>

        <div class="search-container contenedor-filtros-asistencia" style="margin-bottom: 20px;">
            <div class="caja-busqueda">
                <i data-feather="search"></i>
                <input type="text" id="campoBuscar" placeholder="Buscar por nombre o ID..." onkeyup="filtrarEmpleados()">
            </div>
            
            <div class="caja-seleccion">
                <i data-feather="briefcase"></i>
                <select id="seleccionDepto" onchange="filtrarEmpleados()">
                    <option value="">Todos los departamentos</option>
                </select>
            </div>

        </div>

        <div class="contenedor-tabla">
            <table class="tabla-datos" id="tablaEmpleados">
                <thead>
                    <tr>
                        <th>ID EMPLEADO</th>
                        <th>NOMBRE COMPLETO</th>
                        <th>DEPARTAMENTO</th>
                    </tr>
                </thead>
                <tbody id="cuerpoTabla">
                    <tr>
                        <td colspan="3" class="celda-carga">Cargando datos de la base de datos...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="dboperations.js"></script> 
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            feather.replace();
            // Call the cargarEmpleados function defined in dboperations.js which includes JWT handling.
            if (typeof cargarEmpleados === 'function') {
                cargarEmpleados();
            } else {
                console.error('cargarEmpleados function not found.');
            }
        });
    </script>
</body>

</html>
