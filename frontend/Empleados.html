<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empleados - Club Regina</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/feather-icons"></script>

</head>

<body class="dashboard-body">
    <nav class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <i data-feather="box"></i>
            </div>
            <h2>Club Regina</h2>
        </div>
        <ul class="nav-links">
            <li><a href="Menu.html"><i data-feather="home"></i> Inicio</a></li>
            <li class="active"><a href="Empleados.html"><i data-feather="users"></i> Empleados</a></li>
            <li><a href="Asistencias.html"><i data-feather="clock"></i> Asistencias</a></li>
            <li><a href="RegistroCR.html"><i data-feather="user-plus"></i> Registrar Empleado</a></li>
            <li style="margin-top: auto; margin-bottom: 20px;"><a href="Login.html" class="logout"><i
                        data-feather="log-out"></i> Cerrar Sesión</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <header class="top-header">
            <h1>Gestión de Empleados</h1>
        </header>

        <div class="content-card">
            <div class="card-header"
                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                <h2 style="margin-bottom: 0;">Lista de Empleados</h2>
                <button class="submit-btn"
                    style="width: auto; padding: 10px 20px; font-size: 0.95rem; display: flex; align-items: center; justify-content: center; border-radius: 12px; background-color: #0b5c6b; color: white;"
                    onclick="cargarEmpleados()">
                    <i data-feather="refresh-cw" style="width: 16px; height: 16px; margin-right: 8px;"></i> Actualizar
                </button>
            </div>

            <div class="search-container" style="margin-bottom: 20px;">
                <input type="text" id="busquedaNombreEmpleado" placeholder="Buscar por nombre..." onkeyup="filtrarEmpleados()" style="padding: 10px; width: 100%; border-radius: 8px; border: 1px solid #ccc;">
            </div>

            <div class="table-responsive">
                <table class="data-table" id="tablaEmpleados">
                    <thead>
                        <tr>
                            <th>ID Empleado</th>
                            <th>Nombre Completo</th>
                            <th>Departamento</th>
                            <th>Nombre del Departamento</th>
                            <th>Rango</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="5" style="text-align: center; padding: 30px; color: #718096;">Cargando datos...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="dboperations.js"></script>
    <script>
        feather.replace();
        document.addEventListener('DOMContentLoaded', cargarEmpleados);
    </script>
</body>

</html>
