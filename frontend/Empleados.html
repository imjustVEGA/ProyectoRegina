<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empleados - Club Regina</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/feather-icons"></script>

</head>

<body class="dashboard-body">
    <nav class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <i data-feather="box"></i>
            </div>
            <h2>Club Regina</h2>
        </div>
        <ul class="nav-links">
            <li><a href="Menu.html"><i data-feather="home"></i> Inicio</a></li>
            <li class="active"><a href="Empleados.html"><i data-feather="users"></i> Empleados</a></li>
            <li><a href="Asistencias.html"><i data-feather="clock"></i> Asistencias</a></li>
            <li style="margin-top: auto; margin-bottom: 20px;"><a href="Login.html" class="logout"><i
                        data-feather="log-out"></i> Cerrar Sesión</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <header class="top-header">
            <h1>Gestión de Empleados</h1>
        </header>

        <div class="content-card">
            <div class="card-header"
                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                <h2 style="margin-bottom: 0;">Lista de Empleados</h2>
                <button class="submit-btn"
                    style="width: auto; padding: 10px 20px; font-size: 0.95rem; display: flex; align-items: center; justify-content: center; border-radius: 12px; background-color: #0b5c6b; color: white;"
                    onclick="cargarEmpleados()">
                    <i data-feather="refresh-cw" style="width: 16px; height: 16px; margin-right: 8px;"></i> Actualizar
                </button>
            </div>

            <div class="table-responsive">
                <table class="data-table" id="tablaEmpleados">
                    <thead>
                        <tr>
                            <th>ID Empleado</th>
                            <th>Nombre Completo</th>
                            <th>Departamento</th>
                            <th>Nombre del Departamento</th>
                            <th>Rango</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="4" style="text-align: center; padding: 30px; color: #718096;">Cargando datos...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        feather.replace();

        async function cargarEmpleados() {
            const tbody = document.querySelector('#tablaEmpleados tbody');
            tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 30px; color: #718096;">Cargando datos...</td></tr>';

            try {
                const response = await fetch('http://localhost:3000/users');
                if (!response.ok) throw new Error('Error al conectar con el servidor');

                const datos = await response.json();

                if (!datos || datos.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 30px; color: #718096;">No se encontraron empleados.</td></tr>';
                    return;
                }

                tbody.innerHTML = '';

                datos.forEach(emp => {
                    const tr = document.createElement('tr');

                    const nombre = emp.nombreEmpleado || 'N/D';
                    const depto = emp.DepartID !== null ? emp.DepartID : 'N/D';
                    const deptName = emp.departamento || 'N/D';
                    const rango = emp.rango !== null ? emp.rango : 'N/D';

                    tr.innerHTML = `
                        <td><span class="badge badge-id"># ${emp.idempleado}</span></td>
                        <td style="font-weight: 500; color: #2d3748;">${nombre}</td>
                        <td>${depto}</td>
                        <td>${deptName}</td>
                        <td><span class="badge badge-role">${rango}</span></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error("Error al cargar empleados:", error);
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; padding: 30px; color: #e53e3e;">Ocurrió un error al cargar los datos.<br><small>${error.message}</small></td></tr>`;
            }
        }

        document.addEventListener('DOMContentLoaded', cargarEmpleados);
    </script>
</body>

</html>
